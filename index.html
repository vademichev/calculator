<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- Основные заголовки -->
  <title>Раскладка грид</title>

  <!-- Manifest для Android и других браузеров -->
  <link rel="manifest" href="manifest.json">

  <!-- Иконка для Android и общих целей -->
  <link rel="icon" type="image/jpeg" href="logo192.jpg">

  <!-- Иконка для iOS (обязательно!) -->
  <link rel="apple-touch-icon" href="logo192.jpg">

  <!-- Метатеги для полноэкранного режима на iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Calculator">

  <!-- Тема для Safari (на новых iOS) -->
  <meta name="theme-color" content="#3367D6">

  <!-- Стили -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Кнопка / Инструкция для установки -->
  <div id="install-instruction" style="
    position: fixed;
    bottom: 10px;
    left: 10px;
    right: 10px;
    background: #333;
    color: white;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    text-align: center;
    z-index: 1000;
    display: none;
  ">
    <!-- Текст будет подставляться скриптом -->
  </div>

  <!-- Основной интерфейс калькулятора -->
  <div class="container">
    <div class="screen"></div>
    <div class="button b1 bnum">1</div>
    <div class="button b2 bnum">2</div>
    <div class="button b3 bnum">3</div>
    <div class="button b4 bnum">4</div>
    <div class="button b5 bnum">5</div>
    <div class="button b6 bnum">6</div>
    <div class="button b7 bnum">7</div>
    <div class="button b8 bnum">8</div>
    <div class="button b9 bnum">9</div>
    <div class="button b0 bnum">0</div>
    <div class="button deist bplus">+</div>
    <div class="button deist bmin">-</div>
    <div class="button beq">=</div>
    <div class="button deist bmul">*</div>
    <div class="button deist bdiv">/</div>
    <div class="button bpoint">.</div>
    <div class="button func bC">C</div>
    <div class="button func bCE">CE</div>
    <div class="button func bMS">MS</div>
    <div class="button func bMR">MR</div>
  </div>

  <!-- Логика калькулятора -->
  <script>
    let currDeistv = "";
    let Arg = 0;
    let Memory = 0;

    function Load() {
      document.querySelectorAll(".bnum").forEach(function(el) {
        el.onclick = NumClick;
      });
      document.querySelectorAll(".deist").forEach(function(el) {
        el.onclick = DeistClick;
      });
      document.querySelectorAll(".func").forEach(function(el) {
        el.onclick = FuncClick;
      });
      document.querySelector(".beq").onclick = RavnoClick;
    }

    function FuncClick() {
      const deist = this.innerHTML;
      const screen = document.querySelector(".screen");
      if (deist === "C") {
        screen.innerHTML = "";
        currDeistv = "";
        Arg = 0;
      } else if (deist === "CE") {
        screen.innerHTML = "";
      } else if (deist === "MS") {
        Memory = screen.innerHTML;
      } else if (deist === "MR") {
        screen.innerHTML = Memory;
      }
    }

    function RavnoClick() {
      if (currDeistv !== "") {
        const screen = document.querySelector(".screen");
        const Brg = parseFloat(screen.innerHTML) || 0;
        Arg = parseFloat(Arg) || 0;
        let res = 0;
        switch (currDeistv) {
          case "+": res = Arg + Brg; break;
          case "-": res = Arg - Brg; break;
          case "*": res = Arg * Brg; break;
          case "/": res = Arg / Brg; break;
        }
        screen.innerHTML = res;
      }
    }

    function DeistClick() {
      currDeistv = this.innerHTML;
      const screen = document.querySelector(".screen");
      Arg = screen.innerHTML;
      screen.innerHTML = "";
    }

    function NumClick() {
      const num = this.innerHTML;
      const screen = document.querySelector(".screen");
      screen.innerHTML += num;
    }

    window.onload = Load;
  </script>

  <!-- Регистрация Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('serviceworker.js')
          .then(function(reg) {
            console.log('Service Worker зарегистрирован:', reg.scope);
          })
          .catch(function(err) {
            console.error('Ошибка регистрации SW:', err);
          });
      });
    }
  </script>

  <!-- Установка PWA: Android + iOS -->
  <script>
    // Проверяем, запущено ли приложение как установленное (standalone)
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true; // для старых iOS

    // Проверяем, iOS ли это
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

    // Элемент с инструкцией
    const installBox = document.getElementById('install-instruction');

    // Если приложение НЕ установлено
    if (!isStandalone) {
      if (isIOS) {
        // Инструкция для iOS
        installBox.innerHTML = `
          <strong>Добавьте калькулятор на главный экран!</strong><br>
          1. Нажмите на значок <b>«Поделиться»</b> в Safari (квадрат со стрелкой)<br>
          2. Пролистайте вниз и выберите <b>«На экран „Домой“»</b><br>
          3. Нажмите <b>«Добавить»</b>
        `;
        installBox.style.display = 'block';
      } else {
        // Для Android — показываем кнопку установки (если появится beforeinstallprompt)
        // Но пока просто скрываем, так как событие придет позже
      }
    }

    // --- Обработка установки на Android ---
    let installPrompt = null;

    window.addEventListener('beforeinstallprompt', function(event) {
      event.preventDefault();
      installPrompt = event;
      if (!isStandalone && !isIOS) {
        installBox.innerHTML = `
          <button id="install-btn" style="
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
          ">Установить калькулятор на телефон</button>
        `;
        installBox.style.display = 'block';

        document.getElementById('install-btn').addEventListener('click', async function() {
          if (installPrompt) {
            const result = await installPrompt.prompt();
            installPrompt = null;
            installBox.style.display = 'none';
          }
        });
      }
    });

    // Скрыть подсказку, если приложение уже установлено
    window.addEventListener('appinstalled', function() {
      installBox.style.display = 'none';
    });
  </script>
</body>
</html>
